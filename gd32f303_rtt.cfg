# DAPLink v2 极速配置
adapter driver cmsis-dap
cmsis_dap_backend usb_bulk
transport select swd
adapter speed 10000

# 目标芯片 (GD32F303 / STM32F103 兼容)
set CPUTAPID 0
source [find target/swj-dp.tcl]
swj_newdap gd32 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $CPUTAPID
dap create gd32.dap -chain-position gd32.cpu
target create gd32.cpu cortex_m -dap gd32.dap

# 关键：定义 Flash 以防止报错，虽然 RTT 不用它
flash bank gd32.flash stm32f1x 0x08000000 0 0 0 gd32.cpu

# RTT 配置
init
# 自动搜索 RTT 控制块（无需指定地址，OpenOCD 会自己找）
rtt setup 0x20000000 0xC000 "SEGGER RTT"
rtt server start 9090 0
# 设置轮询间隔为 1ms (默认可能是 100ms)
rtt polling_interval 1
rtt start